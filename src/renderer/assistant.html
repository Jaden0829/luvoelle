<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luvoelle 萌宠翻译</title>
  <link rel="stylesheet" href="assistant.css" />
</head>
<body data-side="right">
  <main id="assistant-root" class="assistant-root">
    <section id="pet-view" class="pet-view" aria-label="Luvoelle 萌宠翻译助手">
      <div class="pet-drag-zone" aria-hidden="true"></div>
      <button id="pet-button" class="pet-button" type="button" aria-label="打开萌宠翻译助手">
        <span class="pet-stage" aria-hidden="true">
          <span class="pet-aura"></span>
          <img class="pet-character" src="../../assets/pet-character-hd.png" alt="" draggable="false" />
          <span class="pet-heart pet-heart-one">♥</span>
          <span class="pet-heart pet-heart-two">♥</span>
        </span>
        <span class="pet-tip">翻一下</span>
      </button>
    </section>

    <section id="panel-view" class="panel-view" aria-label="双向翻译窗口">
      <header class="panel-header">
        <div class="panel-pet" aria-hidden="true">
          <span class="panel-pet-halo"></span>
          <img src="../../assets/pet-character-hd.png" alt="" draggable="false" />
        </div>
        <div class="panel-title"><strong>Luvoelle 小翻译</strong><span id="panel-status">随时帮你翻一下</span></div>
        <div class="panel-actions">
          <button id="open-main" type="button" title="打开工作台" aria-label="打开工作台">⌂</button>
          <button id="collapse-panel" type="button" title="收回萌宠" aria-label="收回萌宠">—</button>
          <button id="close-panel" type="button" title="关闭窗口并缩回侧边" aria-label="关闭窗口并缩回侧边">×</button>
        </div>
      </header>

      <div class="language-row">
        <label><span>左侧语言</span><select id="left-language"><option value="zh-CN">中文</option><option value="en">英语</option><option value="vi">越南语</option><option value="th">泰语</option></select></label>
        <button id="swap-languages" class="swap-button" type="button" title="交换语言和文字" aria-label="交换语言和文字">⇄</button>
        <label><span>右侧语言</span><select id="right-language"><option value="en">英语</option><option value="zh-CN">中文</option><option value="vi">越南语</option><option value="th">泰语</option></select></label>
      </div>

      <div class="translation-panes">
        <article class="translation-pane" data-pane="left">
          <div class="pane-toolbar"><strong id="left-label">中文</strong><div><button class="paste-image" data-side="left" type="button">粘贴图片</button><button class="copy-pane" data-side="left" type="button">复制</button></div></div>
          <div class="image-chip" id="left-image-chip" hidden><img id="left-image" alt="左侧粘贴图片"/><span id="left-image-status">正在识别…</span><button type="button" data-remove-image="left">×</button></div>
          <textarea id="left-text" maxlength="8000" placeholder="输入文字，或 Ctrl+V 粘贴图片…"></textarea>
          <span class="pane-count" id="left-count">0 / 8000</span>
        </article>

        <div class="direction-actions">
          <button id="translate-forward" type="button"><span>→</span><small>翻译</small></button>
          <button id="translate-backward" type="button"><span>←</span><small>反向</small></button>
        </div>

        <article class="translation-pane" data-pane="right">
          <div class="pane-toolbar"><strong id="right-label">英语</strong><div><button class="paste-image" data-side="right" type="button">粘贴图片</button><button class="copy-pane" data-side="right" type="button">复制</button></div></div>
          <div class="image-chip" id="right-image-chip" hidden><img id="right-image" alt="右侧粘贴图片"/><span id="right-image-status">正在识别…</span><button type="button" data-remove-image="right">×</button></div>
          <textarea id="right-text" maxlength="8000" placeholder="译文会出现在这里，也可以直接修改…"></textarea>
          <span class="pane-count" id="right-count">0 / 8000</span>
        </article>
      </div>

      <footer class="panel-footer">
        <span id="service-status">使用当前 Luvoelle 翻译服务</span>
        <span class="shortcut-tip">Ctrl + Enter 翻译</span>
      </footer>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
  </main>
  <script src="assistant.js"></script>
</body>
</html>
