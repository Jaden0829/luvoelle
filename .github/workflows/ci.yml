name: Source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Verify source-available licensing
        run: npm run test:license

      - name: Run platform-independent service checks
        run: npm run test:services

      - name: Check macOS source packaging
        run: npm run test:mac-support
